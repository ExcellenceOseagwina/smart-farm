<!DOCTYPE html>
<html>
<head>
    <title>Create New Password | SmartFarm</title>
    <link rel="stylesheet" href="style.css">
    <!-- 1. MUST HAVE THE SUPABASE LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>New Password 🌱</h1>
            <p>Enter your new password below.</p>
            
            <input type="password" id="new-password" placeholder="New Password">
            <input type="password" id="confirm-password" placeholder="Confirm New Password">
            
            <button onclick="updatePassword()">Update Password</button>
        </div>
    </div>

    <!-- 2. MUST HAVE YOUR CONFIG (Contains the _supabase variable) -->
    <script src="config.js"></script>

    <script>
        async function updatePassword() {
    const newPass = document.getElementById('new-password').value;
    const confirmPass = document.getElementById('confirm-password').value;

    if (newPass !== confirmPass) {
        alert("Passwords do not match!");
        return;
    }

    // 1. Update the password in the database
    const { error } = await _supabase.auth.updateUser({
        password: newPass
    });

    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Password updated successfully!");

        // 2. FORCE LOGOUT (This kills the temporary session)
        await _supabase.auth.signOut();
        
        // 3. Clear local memory
        localStorage.clear();

        // 4. NOW send them back to the login page
        window.location.href = 'auth.html';
    }
}
    </script>
</body>
</html>
