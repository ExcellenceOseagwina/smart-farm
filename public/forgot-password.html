<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | SmartFarm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍀</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Reset Password 🌱</h1>
            <p>Enter your email to receive a reset link.</p>
            <input type="email" id="reset-email" placeholder="Enter your registered email">
            <button onclick="sendResetLink()">Send Reset Link</button>
            <p style="margin-top:20px; font-size:0.9rem"><a href="auth.html" style="color:var(--primary)">Back to Login</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        async function sendResetLink() {
            const email = document.getElementById('reset-email').value;
            const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                redirectTo: 'http://127.0.0.1:5500/public/reset-password.html',
            });

            if (error) alert(error.message);
            else alert("Password reset link sent! Please check your email inbox.");
        }
    </script>
</body>
</html>
